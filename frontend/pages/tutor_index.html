<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lớp học - Lanying HSK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-light">
    <!-- Toast -->
    <div class="toast-custom" id="toast"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="tutor_index.html">
                <span class="logo-icon">&#20013;</span>
                <h1 class="m-0 fs-4 fw-bold text-primary-custom">Lanying Gia sư</h1>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarNav">
                <ul class="navbar-nav mx-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link px-3 active text-primary-custom" href="tutor_index.html">Quản lý lớp</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="tutor_profile.html">Hồ sơ cá nhân</a></li>
                </ul>
                <div class="d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0" id="navActions">
                    <!-- Render via JS -->
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white mb-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end border-bottom pb-4 mb-4 gap-3">
                <div>
                    <h2 class="display-6 fw-bold text-dark m-0">Quản lý Lớp học</h2>
                    <p class="text-muted mt-2 mb-0 fs-5" id="greeting-text">Đang tải dữ liệu...</p>
                </div>
                <div id="hsk-badge" class="badge bg-primary text-white fs-6 px-4 py-2 rounded-pill shadow-sm">
                    HSK -
                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-6">
                    <div class="card bg-primary text-white border-0 shadow-sm rounded-4 h-100 p-4" style="background: linear-gradient(135deg, #0ea5e9, #3b82f6) !important;">
                        <h3 class="h5 fw-medium mb-2 opacity-75">Yêu cầu chờ duyệt</h3>
                        <p class="display-4 fw-bold m-0" id="stat-pending">0</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card text-white border-0 shadow-sm rounded-4 h-100 p-4" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <h3 class="h5 fw-medium mb-2 opacity-75">Học sinh đang dạy</h3>
                        <p class="display-4 fw-bold m-0" id="stat-accepted">0</p>
                    </div>
                </div>
            </div>

            <h3 class="h4 fw-bold text-dark mb-4">Danh sách Yêu cầu & Học viên</h3>
            <ul class="list-group list-group-flush gap-3" id="booking-list">
                <div class="text-center py-5 text-secondary">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 fw-medium">⏳ Đang tải danh sách...</p>
                </div>
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function logout() {
            localStorage.removeItem('lanying_token');
            localStorage.removeItem('lanying_user');
            window.location.href = 'login.html';
        }

        async function checkAuth() {
            const user = JSON.parse(localStorage.getItem('lanying_user') || 'null');
            const token = localStorage.getItem('lanying_token');
            if (!user || !token) {
                window.location.href = 'login.html';
                return;
            }
            
            if (user.role !== 'tutor') {
                window.location.replace('../../index.html');
                return;
            }
            
            document.getElementById('navActions').innerHTML = `
                <span class="navbar-text text-primary-custom fw-semibold me-3">Xin chào Giáo viên <b>${user.name}</b></span>
                <button class="btn btn-outline-secondary fw-semibold rounded-3 px-3 py-2" onclick="logout()">Đăng xuất</button>
            `;
            document.getElementById('greeting-text').textContent = `Chào mừng Giáo viên ${user.name} quản lý lớp học!`;

            try {
                const dashData = await AuthAPI.getDashboard();
                if (dashData.role !== 'tutor') {
                    user.role = 'student';
                    localStorage.setItem('lanying_user', JSON.stringify(user));
                    window.location.replace('../../index.html');
                } else {
                    user.name = dashData.name;
                    user.role = 'tutor';
                    localStorage.setItem('lanying_user', JSON.stringify(user));
                    document.getElementById('navActions').innerHTML = `
                        <span class="navbar-text text-primary-custom fw-semibold me-3">Xin chào Giáo viên <b>${dashData.name}</b></span>
                        <button class="btn btn-outline-secondary fw-semibold rounded-3 px-3 py-2" onclick="logout()">Đăng xuất</button>
                    `;
                    document.getElementById('greeting-text').textContent = `Chào mừng Giáo viên ${dashData.name} quản lý lớp học!`;
                }
            } catch(e) {
                console.log('Could not verify role:', e.message);
            }
        }

        async function loadDashboard() {
            try {
                const data = await AuthAPI.getDashboard();
                document.getElementById('hsk-badge').textContent = `Cấp độ hiện tại: HSK ${data.hsk_level}`;

                const bookings = data.bookings;
                const pending = bookings.filter(b => b.status === 'pending').length;
                const accepted = bookings.filter(b => b.status === 'accepted').length;

                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-accepted').textContent = accepted;

                const listEl = document.getElementById('booking-list');
                if (bookings.length === 0) {
                    listEl.innerHTML = `<div class="text-center py-5 text-muted bg-light rounded-4 border">Chưa có yêu cầu nào.</div>`;
                    return;
                }

                listEl.innerHTML = bookings.map(b => {
                    const date = new Date(b.created_at).toLocaleString('vi-VN');
                    let statusBadge = b.status === 'pending' ? '<span class="badge bg-warning-subtle text-warning-emphasis px-3 py-2 rounded-pill">Chờ duyệt</span>' : (b.status === 'accepted' ? '<span class="badge bg-success-subtle text-success-emphasis px-3 py-2 rounded-pill">Đã duyệt</span>' : '<span class="badge bg-danger-subtle text-danger-emphasis px-3 py-2 rounded-pill">Đã từ chối</span>');
                    
                    let actionBtns = '';
                    if (b.status === 'pending') {
                        actionBtns = `
                            <div class="d-flex gap-2 mt-3 mt-md-0">
                                <button class="btn btn-success fw-semibold px-4 rounded-3 shadow-sm" onclick="updateBooking(${b.id}, 'accepted')">Duyệt</button>
                                <button class="btn btn-danger fw-semibold px-4 rounded-3 shadow-sm" onclick="updateBooking(${b.id}, 'rejected')">Từ chối</button>
                            </div>
                        `;
                    }

                    return `
                        <li class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-md-center p-4 border rounded-4 bg-white shadow-sm">
                            <div class="mb-3 mb-md-0">
                                <h4 class="h5 fw-bold text-dark mb-1">Học viên: ${b.student_name}</h4>
                                <p class="text-secondary small mb-2">Ngày gửi: ${date}</p>
                                <div>Trạng thái: ${statusBadge}</div>
                            </div>
                            ${actionBtns}
                        </li>
                    `;
                }).join('');

            } catch (err) {
                showToast(`Lỗi tải dữ liệu: ${err.message}`);
            }
        }

        async function updateBooking(bookingId, status) {
            try {
                await TutorAPI.updateBookingStatus(bookingId, status);
                showToast(`Đã ${status === 'accepted' ? 'duyệt' : 'từ chối'} lớp thành công!`);
                loadDashboard();
            } catch (err) {
                showToast(`Lỗi: ${err.message}`);
            }
        }

        checkAuth();
        loadDashboard();
    </script>
</body>
</html>
