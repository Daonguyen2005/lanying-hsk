<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Gia sư - Lanying HSK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-light">
    <!-- Toast -->
    <div class="toast-custom" id="toast"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="tutor_index.html">
                <span class="logo-icon">&#20013;</span>
                <h1 class="m-0 fs-4 fw-bold text-primary-custom">Lanying Gia sư</h1>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarNav">
                <ul class="navbar-nav mx-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link px-3" href="tutor_index.html">Quản lý lớp</a></li>
                    <li class="nav-item"><a class="nav-link px-3 active text-primary-custom" href="tutor_profile.html">Hồ sơ cá nhân</a></li>
                </ul>
                <div class="d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0" id="navActions">
                    <!-- Render via JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-5">
                        <div class="tutor-avatar fs-1 shadow-sm mx-auto mb-3" style="width: 80px; height: 80px;" id="avatar-preview">T</div>
                        <h2 class="fw-bold text-dark m-0">Cập nhật Hồ sơ</h2>
                        <p class="text-secondary mt-2">Hồ sơ chi tiết giúp AI giới thiệu bạn tới đúng học viên hơn</p>
                    </div>

                    <form id="profile-form" onsubmit="saveProfile(event)">
                        <!-- Hourly Rate -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Mức lương yêu cầu (VNĐ/giờ) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-lg bg-light" id="hourly_rate" placeholder="Ví dụ: 150000" required>
                        </div>

                        <!-- Bio -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Giới thiệu bản thân (Bio)</label>
                            <textarea class="form-control form-control-lg bg-light" id="bio" rows="4" placeholder="Giới thiệu kinh nghiệm giảng dạy, phương pháp của bạn..."></textarea>
                        </div>

                        <!-- Teaching Levels -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark mb-3 d-block">Bạn có thể dạy HSK cấp độ nào? <span class="text-danger">*</span></label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input teaching-levels" type="checkbox" value="1" id="hsk1">
                                    <label class="form-check-label fw-medium" for="hsk1">HSK 1</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input teaching-levels" type="checkbox" value="2" id="hsk2">
                                    <label class="form-check-label fw-medium" for="hsk2">HSK 2</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input teaching-levels" type="checkbox" value="3" id="hsk3">
                                    <label class="form-check-label fw-medium" for="hsk3">HSK 3</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input teaching-levels" type="checkbox" value="4" id="hsk4">
                                    <label class="form-check-label fw-medium" for="hsk4">HSK 4</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input teaching-levels" type="checkbox" value="5" id="hsk5">
                                    <label class="form-check-label fw-medium" for="hsk5">HSK 5</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input teaching-levels" type="checkbox" value="6" id="hsk6">
                                    <label class="form-check-label fw-medium" for="hsk6">HSK 6</label>
                                </div>
                            </div>
                        </div>

                        <!-- Specialization -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Thế mạnh giảng dạy (Tùy chọn)</label>
                            <input type="text" class="form-control form-control-lg bg-light" id="specialization" placeholder="Ví dụ: Luyện giao tiếp, Chữa phát âm, Trẻ em...">
                        </div>

                        <!-- Teaching Modes -->
                        <div class="mb-5">
                            <label class="form-label fw-bold text-dark mb-3 d-block">Hình thức dạy</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input teaching-modes" type="checkbox" value="online" id="mode-online">
                                    <label class="form-check-label fw-medium" for="mode-online">Online (Zoom/Meet)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input teaching-modes" type="checkbox" value="offline" id="mode-offline">
                                    <label class="form-check-label fw-medium" for="mode-offline">Offline (Gặp trực tiếp)</label>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-primary-custom w-100 py-3 rounded-3 fs-5 fw-bold shadow-sm" type="submit" id="submitBtn">Lưu Hồ Sơ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function logout() {
            localStorage.removeItem('lanying_token');
            localStorage.removeItem('lanying_user');
            window.location.href = 'login.html';
        }

        async function checkAuth() {
            const user = JSON.parse(localStorage.getItem('lanying_user') || 'null');
            const token = localStorage.getItem('lanying_token');
            if (!user || !token || user.role !== 'tutor') {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('navActions').innerHTML = `
                <span class="navbar-text text-primary-custom fw-semibold me-3">Xin chào Giáo viên <b>${user.name}</b></span>
                <button class="btn btn-outline-secondary fw-semibold rounded-3 px-3 py-2" onclick="logout()">Đăng xuất</button>
            `;
            document.getElementById('avatar-preview').textContent = user.name.charAt(0).toUpperCase();
        }

        async function loadProfile() {
            try {
                const data = await TutorAPI.getProfile();
                
                if (data.hourly_rate) document.getElementById('hourly_rate').value = data.hourly_rate;
                if (data.bio) document.getElementById('bio').value = data.bio;
                if (data.specialization) document.getElementById('specialization').value = data.specialization;

                if (data.teaching_levels) {
                    const levels = data.teaching_levels.split(',').map(s => s.trim());
                    document.querySelectorAll('.teaching-levels').forEach(cb => {
                        if (levels.includes(cb.value)) cb.checked = true;
                    });
                }
                
                // Assuming backend will add modes later, we handle it gracefully if missing
                if (data.teaching_modes) {
                    const modes = data.teaching_modes.split(',').map(s => s.trim());
                    document.querySelectorAll('.teaching-modes').forEach(cb => {
                        if (modes.includes(cb.value)) cb.checked = true;
                    });
                }
            } catch (err) {
                showToast(`Chưa thể tải dữ liệu cũ: ${err.message}`);
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Đang lưu...';
            btn.disabled = true;

            const hourly_rate = parseInt(document.getElementById('hourly_rate').value);
            const bio = document.getElementById('bio').value;
            const specialization = document.getElementById('specialization').value;

            const levels = Array.from(document.querySelectorAll('.teaching-levels:checked')).map(cb => cb.value).join(',');
            
            // Collect teaching modes to add to Bio or if backend supports it natively in future
            const modes = Array.from(document.querySelectorAll('.teaching-modes:checked')).map(cb => cb.value).join(',');
            let finalBio = bio;
            if (modes) {
                finalBio = bio + `\n[Hình thức dạy: ${modes}]`;
            }

            if (!levels) {
                showToast('Vui lòng chọn ít nhất 1 cấp độ HSK bạn có thể dạy!');
                btn.textContent = 'Lưu Hồ Sơ';
                btn.disabled = false;
                return;
            }

            try {
                await TutorAPI.updateProfile(bio, hourly_rate, specialization, levels);
                showToast('Lưu hồ sơ thành công!');
                // Reload after delay
                setTimeout(() => window.location.reload(), 1500);
            } catch (err) {
                showToast(`Lỗi lưu hồ sơ: ${err.message}`);
            } finally {
                btn.textContent = 'Lưu Hồ Sơ';
                btn.disabled = false;
            }
        }

        checkAuth();
        loadProfile();
    </script>
</body>
</html>
