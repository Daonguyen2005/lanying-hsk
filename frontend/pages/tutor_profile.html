<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ Gia sư - Lanying HSK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <style>
        .container { max-width: 800px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        h2 { color: var(--primary); margin-bottom: 2rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #334155; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 0.8rem; border: 2px solid #e2e8f0; border-radius: 8px; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s; font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; width: 100%; }
        .btn-submit:hover { background: #0284c7; }
        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: none; font-weight: 600; }
        .alert.success { background: #dcfce7; color: #166534; display: block; }
        .alert.error { background: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body style="background: #f8fafc">

    <nav class="navbar">
        <div class="logo">
            <span class="logo-icon" style="font-size:1.8rem;font-weight:800;color:#0ea5e9;font-family:serif;">&#20013;</span>
            <h1 style="cursor:pointer" onclick="window.location='../../index.html'">Lanying HSK</h1>
        </div>
        <div class="nav-actions">
            <button class="btn-outline" onclick="window.location='../../index.html'">Về trang chủ</button>
        </div>
    </nav>

    <div class="container">
        <h2>Quản lý Hồ sơ năng lực</h2>
        
        <div id="msg" class="alert" style="display:none"></div>

        <form id="profile-form" onsubmit="saveProfile(event)">
            <div class="form-group">
                <label>Trình độ HSK cao nhất của bạn:</label>
                <select id="hsk_level" required>
                    <option value="1">HSK 1</option>
                    <option value="2">HSK 2</option>
                    <option value="3">HSK 3</option>
                    <option value="4">HSK 4</option>
                    <option value="5">HSK 5</option>
                    <option value="6">HSK 6</option>
                </select>
            </div>

            <div class="form-group">
                <label>Các cấp độ bạn tự tin giảng dạy (Ví dụ: "1,2,3"):</label>
                <input type="text" id="teaching_levels" placeholder="Nhập các số cách nhau bởi dấu phẩy" required>
                <small style="color:#64748b">Lưu ý: Bạn chỉ có thể dạy cấp độ nhỏ hơn hoặc bằng HSK cao nhất của mình.</small>
            </div>

            <div class="form-group">
                <label>Thế mạnh / Chuyên môn chính:</label>
                <input type="text" id="specialization" placeholder="Ví dụ: Giao tiếp, Luyện thi, Thương mại..." required>
            </div>

            <div class="form-group">
                <label>Mức lương mong muốn (VND / 1 giờ học):</label>
                <input type="number" id="hourly_rate" placeholder="150000" min="0" step="10000" required>
            </div>

            <div class="form-group">
                <label>Giới thiệu bản thân (Bio):</label>
                <textarea id="bio" rows="4" placeholder="Giới thiệu kinh nghiệm giảng dạy của bạn..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Lưu Hồ sơ & Bật tìm kiếm AI</button>
        </form>
    </div>

    <script src="../js/api.js?v=2"></script>
    <script>
        // Kiểm tra quyền
        const user = getUser();
        if (!user || user.role !== 'tutor') {
            alert('Trang này chỉ dành cho Gia sư!');
            window.location.href = '../../index.html';
        }

        async function loadProfile() {
            try {
                const data = await TutorAPI.getMyProfile();
                document.getElementById('hsk_level').value = data.hsk_level || 1;
                document.getElementById('teaching_levels').value = data.teaching_levels || "1";
                document.getElementById('specialization').value = data.specialization || "";
                document.getElementById('hourly_rate').value = data.hourly_rate || 0;
                document.getElementById('bio').value = data.bio || "";
            } catch (err) {
                console.error(err);
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            const msgEl = document.getElementById('msg');
            msgEl.style.display = 'none';
            msgEl.className = 'alert';

            const payload = {
                hsk_level: parseInt(document.getElementById('hsk_level').value),
                teaching_levels: document.getElementById('teaching_levels').value,
                specialization: document.getElementById('specialization').value,
                hourly_rate: parseFloat(document.getElementById('hourly_rate').value),
                bio: document.getElementById('bio').value
            };

            try {
                await TutorAPI.updateMyProfile(payload);
                msgEl.textContent = "Lưu hồ sơ thành công! Trí tuệ nhân tạo (AI) đã tính toán lại điểm số của bạn.";
                msgEl.classList.add('success');
                window.scrollTo({top:0, behavior:'smooth'});
            } catch(err) {
                msgEl.textContent = err.message;
                msgEl.classList.add('error');
                window.scrollTo({top:0, behavior:'smooth'});
            }
        }

        loadProfile();
    </script>
</body>
</html>
